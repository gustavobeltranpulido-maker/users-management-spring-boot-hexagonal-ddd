services:

  postgres:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: users-management-db:17
    container_name: users-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-crud_usuarios}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234567}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-crud_usuarios}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: users-management:2.1.0
    container_name: users-management-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    # Spring relaxed binding: DB_HOST -> db.host, SMTP_FROM_ADDRESS -> smtp.from.address, etc.
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crud_usuarios}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234567}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-tu_correo@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-tu_app_password_aqui}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-tu_correo@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Gestion de Usuarios}
      JWT_SECRET: ${JWT_SECRET:-ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}

volumes:
  postgres-data:
