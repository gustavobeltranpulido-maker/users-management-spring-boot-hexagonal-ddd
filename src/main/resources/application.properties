# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}
spring.config.import=optional:file:./.environments/application-secrets.properties

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos PostgreSQL (local, Render o Supabase)
# DB_SSL_MODE: disable | prefer | require | verify-full  (Supabase: require)
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:prefer}

# =============================================
# Kafka (Aiven): publicacion asincrona de eventos user.created / user.updated / user.deleted
# Con KAFKA_ENABLED=false (por defecto) los eventos se omiten y la app funciona sin broker.
# =============================================
kafka.enabled=${KAFKA_ENABLED:false}
kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS:users.events}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
# Certificado CA de Aiven en formato PEM (contenido completo, con BEGIN/END CERTIFICATE)
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.certificates=${KAFKA_CA_CERT:}
spring.kafka.producer.acks=all
# Limita cuanto puede bloquear send() si el broker no responde (por defecto 60 s)
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:5000}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
